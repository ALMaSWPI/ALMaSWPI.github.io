    <script>
      (async function () {
        const { pathname, origin, search, hash } = window.location;
        if (pathname.match(/(index.html|\/?)$/) == null) {
          window.location.href = `${origin}${pathname}/${search}${hash}`;
          return;
        }
        await import(
          '../config-utils.js?_=resilient-1'
        );
      }.call(this));
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        transition: background-color 0.3s ease;
      }

      body {
        background-color: #fff;
        color: #000;
      }

      body.jp-mod-dark {
        background-color: #111;
        color: #fff;
      }

      #jupyterlite-loading-indicator {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1000;
        opacity: 0; /* Hidden by default */
        transition: opacity 0.5s ease-out;
        display: none; /* Hidden by default */
      }

      #jupyterlite-loading-indicator.hidden {
        animation: fadeOut 0.5s ease-out forwards;
        pointer-events: none;
      }

      /* Show the indicator when needed */
      #jupyterlite-loading-indicator:not(.hidden) {
        opacity: 1;
        display: block;
      }

      .jupyterlite-loading-indicator-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border: 6px solid rgba(0, 0, 0, 0.1);
        border-top: 6px solid #FFDC00; /* Bright yellow color */
        border-radius: 50%;
        animation: jupyter-spin 1s linear infinite;
      }

      body.jp-mod-dark .jupyterlite-loading-indicator-spinner {
        border: 6px solid rgba(255, 255, 255, 0.1);
        border-top: 6px solid #FFDC00;
      }

      .jupyterlite-loading-indicator-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 16px;
      }

      /* Adjust text color based on theme */
      body.jp-mod-light .jupyterlite-loading-indicator-text {
        color: #000000;
      }

      body.jp-mod-dark .jupyterlite-loading-indicator-text {
        color: #ffffff;
      }

      @keyframes jupyter-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes fadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>

<script>
  (function () {
    if (window.sessionStorage.getItem('es3011-root-launch') === '1') {
      window.sessionStorage.removeItem('es3011-root-launch');
      var attempts = 0;
      var cleanUrlWhenReady = window.setInterval(function () {
        attempts += 1;
        if (document.querySelector('.jp-FileBrowser, .jp-DirListing')) {
          window.clearInterval(cleanUrlWhenReady);
          window.history.replaceState(null, '', '../index.html');
        } else if (attempts > 160) {
          window.clearInterval(cleanUrlWhenReady);
        }
      }, 250);
    }
  }());
</script>

<!-- ===== Settings panel ===== -->
<!-- Settings gear button (bottom-right corner of every notebook page).
     Injected by serve_with_banner() in app.py just before </body>.

     Clicking the gear (&#x2699;) opens a small popup panel with two
     toggle switches:
       "Show Code"       — hides/shows all code cell input areas
       "Show AI Buttons" — hides/shows the Gemini sidebar button,
                           the AI Tutor bar button, and the
                           "Ask about this block" cell links

     Toggles delegate to hide_code.js (window.setCodeVisibility and
     window.setAIVisibility) which applies CSS classes and persists
     state to localStorage. -->

<!-- Settings panel styles -->
<link rel="stylesheet" href="../../static/css/settings_panel.css">

<div id="settings-wrap">
  <!-- Gear button — fixed to bottom-right corner of the viewport -->
  <button id="settings-btn" title="Settings">&#x2699;</button>

  <!-- The popup panel containing the toggle switches -->
  <div id="settings-panel">
    <!-- Header bar with title and close button -->
    <div id="settings-header">
      <span>Settings</span>
      <button id="settings-close">&times;</button>
    </div>
    <!-- Body containing the toggle items -->
    <div id="settings-body">
      <!-- Toggle for code cell visibility -->
      <div class="settings-item">
        <span class="settings-label">Show Code</span>
        <label class="settings-toggle">
          <input type="checkbox" id="code-visibility-toggle">
          <span class="settings-slider"></span>
        </label>
      </div>
      <!-- Toggle for AI element visibility -->
      <div class="settings-item">
        <span class="settings-label">Show AI Buttons</span>
        <label class="settings-toggle">
          <input type="checkbox" id="ai-visibility-toggle">
          <span class="settings-slider"></span>
        </label>
      </div>
    </div>
  </div>
</div>

<!-- Settings panel logic — open/close, toggle event wiring -->
<script src="../../static/settings_panel.js"></script>
<script src="../../static/cell_tutor_links.js"></script></body>
